<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="career-coach: a local interview and career coach on Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- title -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <circle cx="86" cy="118" r="9" fill="#ededed"/>
    <text x="106" y="126" font-size="22" font-weight="600" fill="#a1a1a1" letter-spacing=".5">career-coach</text>
    <text x="72" y="196" font-size="50" font-weight="700" fill="#ededed" letter-spacing="-1.5">Practice like it's the</text>
    <text x="72" y="254" font-size="50" font-weight="700" fill="#ededed" letter-spacing="-1.5">interview. Every day.</text>
    <text x="74" y="304" font-size="19" fill="#8f8f8f">Hidden tests · hint ladder · recall-based reading · weekly tests</text>
    <text x="74" y="334" font-size="19" fill="#8f8f8f">Runs locally on Claude Code. 20 minutes counts.</text>
  </g>

  <!-- mini "Do this now" card -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect x="768" y="62" width="440" height="276" rx="18" fill="#111111" stroke="#2e2e2e"/>
    <text x="796" y="100" font-size="12" fill="#6b6b6b" letter-spacing="1.6" font-family="ui-monospace, Consolas, monospace">DO THIS NOW</text>

    <rect x="788" y="116" width="400" height="60" rx="12" fill="#171717" stroke="#2e2e2e"/>
    <circle cx="816" cy="146" r="13" fill="#ededed"/>
    <text x="811" y="151" font-size="13" font-weight="600" fill="#0a0a0a" font-family="ui-monospace, Consolas, monospace">1</text>
    <text x="842" y="140" font-size="11" fill="#6b6b6b" letter-spacing="1.2" font-family="ui-monospace, Consolas, monospace">REVISE</text>
    <text x="842" y="160" font-size="15" font-weight="600" fill="#ededed">Two pointers · revision 2 of 3</text>

    <rect x="788" y="184" width="400" height="60" rx="12" fill="#141414" stroke="#222222"/>
    <circle cx="816" cy="214" r="13" fill="none" stroke="#3a3a3a"/>
    <text x="811" y="219" font-size="13" fill="#a1a1a1" font-family="ui-monospace, Consolas, monospace">2</text>
    <text x="842" y="208" font-size="11" fill="#6b6b6b" letter-spacing="1.2" font-family="ui-monospace, Consolas, monospace">PRACTICE</text>
    <text x="842" y="228" font-size="15" font-weight="600" fill="#d4d4d4">q3 · Pair with exact sum</text>

    <text x="796" y="282" font-size="12" fill="#6b6b6b" letter-spacing="1.6" font-family="ui-monospace, Consolas, monospace">THIS WEEK · 4 OF 5 DAYS</text>
    <g transform="translate(806,306)">
      <circle cx="0" cy="0" r="10" fill="#ededed"/>
      <circle cx="34" cy="0" r="10" fill="#ededed"/>
      <circle cx="68" cy="0" r="10" fill="none" stroke="#3a3a3a"/>
      <circle cx="102" cy="0" r="10" fill="#ededed"/>
      <circle cx="136" cy="0" r="10" fill="#ededed"/>
      <circle cx="170" cy="0" r="10" fill="none" stroke="#6b6b6b" stroke-dasharray="3 3"/>
      <circle cx="204" cy="0" r="10" fill="none" stroke="#2a2a2a"/>
    </g>
  </g>
</svg>
